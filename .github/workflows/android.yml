name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack project zip (only if the project was uploaded as a .zip)
        run: |
          if [ ! -f settings.gradle.kts ]; then
            zip_file=$(ls ./*.zip 2>/dev/null | head -n 1)
            if [ -z "$zip_file" ]; then
              echo "No settings.gradle.kts and no .zip found in the repository root." >&2
              exit 1
            fi
            unzip -q "$zip_file" -d _unpacked
            root=$(dirname "$(find _unpacked -name settings.gradle.kts | head -n 1)")
            cp -a "$root"/. .
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Gradle Wrapper (Gradle 8.7)
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyNotes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload generated Gradle Wrapper files
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-files
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
